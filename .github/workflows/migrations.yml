name: Migrations

# Replaces the "Supabase Preview" check, which never worked: it fired
# only on migration changes and then either 404'd in four seconds
# ("Postgres config not found") or hung forever waiting on a branch
# action, because two stale dashboard integrations were pointed at this
# repo and neither could provision. It never applied a migration, so
# every `supabase/migrations/*.sql` file in this repo has shipped
# unexecuted by CI.
#
# This job does the thing that check only claimed to: boot a clean
# Postgres and replay every migration, in order, from nothing. It needs
# no secrets and no Supabase account — the CLI runs the database in a
# container on the runner.

on:
  pull_request:
    # `supabase/**` rather than `supabase/migrations/**` so a change to
    # config.toml re-runs the check too, and this workflow is listed so
    # that edits to the check are validated by the check.
    #
    # NOTE: if this is ever made a REQUIRED status check, drop these
    # filters. GitHub leaves a required check that never ran stuck as
    # "expected", which blocks every PR that doesn't touch SQL.
    paths:
      - 'supabase/**'
      - '.github/workflows/migrations.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/migrations.yml'

concurrency:
  group: migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    name: Apply to a clean database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          # Pinned rather than `latest`: this check is infrastructure,
          # and a CLI release changing behaviour should be a deliberate
          # bump in a PR, not a Tuesday where main goes red.
          version: 2.113.0

      - name: Start Postgres
        run: supabase db start

      # `db start` already applies the migrations on a cold volume, but
      # only on a cold volume — it is a no-op against a database that
      # already exists. `db reset` drops and rebuilds unconditionally,
      # so this step, not the one above, is the guarantee that every
      # migration ran in filename order against nothing. It fails on the
      # first statement Postgres rejects. --no-seed because there is no
      # seed script and this is about schema, not data.
      - name: Replay every migration from scratch
        run: supabase db reset --local --no-seed

      # A migration can apply "successfully" and still do nothing —
      # every DDL statement here is IF NOT EXISTS-guarded, which turns a
      # typo'd object name into a silent no-op. Assert the outcome, not
      # just the absence of an error.
      - name: Verify the resulting schema
        run: supabase db query --local --file supabase/ci/verify-schema.sql

      # Behavioural cross-tenant isolation tests (pgTAP, supabase/tests/database).
      # The step above proves the schema EXISTS; this proves it ISOLATES: for
      # every table, role-gated RPC and storage bucket it checks that one tenant
      # (or anon) cannot read, change or plant another tenant's data, with
      # positive controls so a broken harness cannot pass vacuously. It runs
      # only against this job's throw-away local database (--local); the suite
      # also refuses to run if the database holds any non-test user. The two
      # previously known, non-cross-tenant gaps (G1: missing Data API grants,
      # F1: member-readable credential columns) are CLOSED and enforced as hard
      # assertions; any failing assertion fails the job.
      - name: Database tests (cross-tenant isolation)
        run: |
          bash supabase/ci/apply-sql.sh supabase/ci/assert-real-grants-mode.sql
          supabase test db --local

      # Second pass, "open grants": the same suite with the legacy open Data API
      # grants emulated ON TOP of the real ones, so RLS is again the only barrier
      # under test and a regression in a policy cannot hide behind the
      # least-privilege grants from migration 061. The first pass above runs
      # against the real grants, where every positive control proves an allowed
      # operation actually works.
      #
      # The mode is switched by a marker SCHEMA (tests_open_grants), not by
      # `ALTER DATABASE ... SET`: `supabase db query` connects as `postgres`, which
      # is not a superuser here, so setting a database-level parameter fails with
      # "permission denied to set parameter". The EXIT trap removes the marker even
      # when the suite fails, and 005_grants_mode proves the switch works both ways.
      # SQL files go through supabase/ci/apply-sql.sh (psql in the DB container)
      # because `supabase db query --file` rejects multi-statement files.
      - name: Database tests (RLS as the only barrier, open grants emulated)
        run: |
          trap 'bash supabase/ci/apply-sql.sh supabase/ci/disable-open-grants-mode.sql' EXIT
          bash supabase/ci/apply-sql.sh supabase/ci/enable-open-grants-mode.sql
          supabase test db --local

      # Third pass, "older project": give the database the legacy open default
      # privileges, then re-apply the grant migrations over them (061 re-grants the
      # credential tables table-wide, 063 then narrows them again, and 065 re-grants the
      # deletion-signal table that 061 predates — exactly as the migrations run in order) and re-run the suite. Proves the migrations
      # converge an over-granted project to the same least-privilege state, not only
      # a fresh one. The mode marker is asserted absent first, so this pass tests the
      # real grants. Last step: it leaves the database modified.
      - name: Database tests (061 + 063 + 065 re-applied over legacy open grants)
        run: |
          bash supabase/ci/apply-sql.sh supabase/ci/assert-real-grants-mode.sql
          bash supabase/ci/apply-sql.sh supabase/ci/legacy-open-grants.sql
          bash supabase/ci/apply-sql.sh supabase/migrations/061_data_api_grants.sql
          bash supabase/ci/apply-sql.sh supabase/migrations/063_credential_column_privileges.sql
          bash supabase/ci/apply-sql.sh supabase/migrations/065_realtime_deletion_signals.sql
          # 067 creates account_memberships and grants it explicitly; 061 predates it, so
          # re-applying 061 over legacy grants revokes that grant (same reason as 065).
          # 067 is idempotent (IF NOT EXISTS / CREATE OR REPLACE / ON CONFLICT).
          bash supabase/ci/apply-sql.sh supabase/migrations/067_account_memberships.sql
          supabase test db --local
