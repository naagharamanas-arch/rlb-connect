name: Publish image

# Builds the app image for ONE environment and pushes it to GHCR. Manual
# trigger only: nothing is published until a person runs it. NEXT_PUBLIC_*
# values are public by design and come from that GitHub Environment's
# *variables* (not secrets); runtime secrets are never part of the build.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (selects the GitHub Environment holding its NEXT_PUBLIC_* variables)
        type: choice
        options: [staging]
        default: staging

concurrency:
  group: publish-image-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build and push (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_APP_LOCALE: ${{ vars.NEXT_PUBLIC_APP_LOCALE || 'en' }}
    steps:
      - uses: actions/checkout@v7

      - name: Require the environment's public build variables
        run: |
          for v in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY NEXT_PUBLIC_SITE_URL; do
            if [ -z "${!v}" ]; then echo "::error::Variable $v is not set on the '${{ inputs.environment }}' environment"; exit 1; fi
          done

      # The staging image must be wired to the staging Supabase project and
      # nothing else. Only the host is checked and echoed (it is public); no
      # key value is ever printed.
      - name: Require the approved Supabase project for this environment
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          prod_ref="gcdtrjbmhnvlnqqwppfp"
          case "$TARGET_ENV" in
            staging) expected_host="seaovyepglxfiqmjjpmw.supabase.co" ;;
            *) echo "::error::No approved Supabase host is defined for environment '$TARGET_ENV'"; exit 1 ;;
          esac
          case "$NEXT_PUBLIC_SUPABASE_URL" in
            *"$prod_ref"*) echo "::error::NEXT_PUBLIC_SUPABASE_URL points at the Production project; refusing to build"; exit 1 ;;
          esac
          # Exact string match (no regex): the URL must be the approved host,
          # optionally with one trailing slash, and nothing else.
          case "$NEXT_PUBLIC_SUPABASE_URL" in
            "https://${expected_host}" | "https://${expected_host}/") ;;
            *)
              echo "::error::NEXT_PUBLIC_SUPABASE_URL must be https://${expected_host} for environment '$TARGET_ENV'"
              exit 1
              ;;
          esac
          echo "Supabase URL host matches the approved $TARGET_ENV project ($expected_host)"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Per-environment, per-commit tag: the same commit yields a
          # distinct image for each environment (public values differ).
          tags: ${{ env.IMAGE }}:${{ inputs.environment }}-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_APP_LOCALE=${{ env.NEXT_PUBLIC_APP_LOCALE }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}
            org.opencontainers.image.version=${{ inputs.environment }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.environment }}
          cache-to: type=gha,mode=max,scope=${{ inputs.environment }}

      - name: Build summary
        env:
          TARGET_ENV: ${{ inputs.environment }}
          IMAGE_TAG: ${{ env.IMAGE }}:${{ inputs.environment }}-${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Image published"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Image tag | \`${IMAGE_TAG}\` |"
            echo "| Image digest | \`${IMAGE_DIGEST}\` |"
            echo "| Environment | ${TARGET_ENV} |"
          } >> "$GITHUB_STEP_SUMMARY"
